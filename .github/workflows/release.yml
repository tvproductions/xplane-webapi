name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
      - run: uv python install 3.12.16
      - run: test "$TAG_SHA" = "$(git rev-parse origin/main)"
        env:
          TAG_SHA: ${{ github.sha }}
      - run: uv run --frozen --python 3.12.16 python tools/release.py check-tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: uv build --python 3.12.16 --no-sources
      - run: uv run --frozen --python 3.12.16 twine check --strict dist/*
      - run: uv run --frozen --python 3.12.16 python tools/release.py check-dist dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  compatibility:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.16"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
      - run: uv python install ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions
          path: dist/
      - run: uv venv --python ${{ matrix.python-version }} .smoke
      - run: uv pip install --python .smoke/bin/python dist/*.whl
      - run: |
          expected_version="${RELEASE_TAG#v}"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.smoke/bin/python" "$GITHUB_WORKSPACE/tools/installed_smoke.py" "$expected_version"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  pypi:
    needs: compatibility
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          verbose: true

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: softprops/action-gh-release@v3.0.4
        with:
          generate_release_notes: true
          files: dist/*

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 4
    groups:
      runtime-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
